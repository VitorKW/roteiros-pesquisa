function pageExplore(){let ds=DEST.filter(d=>(d.name+' '+d.region+' '+d.mode).toLowerCase().includes(query.toLowerCase()));return `<div class="row between wrap"><div><div class="eyebrow">Descubra pelo mapa, pelo lugar, pela curiosidade</div><h1>Seu mundo, do seu jeito.</h1><p class="muted mt8">Escolha um destino ou encontre o que você quer viver por lá.</p></div></div><div class="mt24 field"><label for="explore-q">Pesquisar destinos, restaurantes, hotéis, atrações ou publicações</label><input id="explore-q" placeholder="Experimente: Paris, Coliseu, Blumenau..." value="${S(query)}"></div><div class="filter-strip">${['all','Regional','Nacional','Internacional'].map(t=>`<button class="pill ${searchMode===t?'active':''}" data-action="exploremode" data-id="${t}">${t==='all'?'Todos os destinos':t}</button>`).join('')}</div><div id="explore-results">${exploreResults()}</div>`}

function placeCard(p){return `<article class="card place-card">${imageTag(p.photo,p.name,'cover',`data-action="quickplace" data-id="${p.id}"`)}<div class="details"><div class="row between"><span class="tag ${p.fiction?'gray':'orange'}">${S(p.category)}</span><small>${fmt(p.distance)} km*</small></div><h3>${S(p.name)}</h3><div class="muted mini">${p.fiction?'Estabelecimento fictício • imagem ilustrativa':'Ponto de interesse real • localização indicativa'}</div><div class="row between wrap" style="margin-top:auto"><b style="color:var(--green)">${cash(p.price)}</b><span class="mini muted">${S(p.priceUnit)}</span></div><div class="row wrap gap8"><button class="btn sm" data-action="addplace" data-id="${p.id}">${ic('plus',15)} Roteiro</button><button class="btn ghost sm" data-action="quickplace" data-id="${p.id}">Detalhes</button><button class="icon-btn" title="Ver perfil" data-go="place" data-id="${p.id}">${ic('chevron',18)}</button></div></div></article>`}

function pageDestination(){let d=findDest(page.id);const matches=PLACES.filter(p=>(p.city===d.id||distanceKm(d,p)<=radius)&&(category==='all'||p.type===category)&&distanceKm(d,p)<=radius);let cr=COMMUNITY_ROUTES.filter(r=>r.city===d.id&&(budgetFilter==='all'||r.budget<=Number(budgetFilter)));let posts=allPosts().filter(p=>p.city===d.id);return `<button class="text-btn mb16" data-action="back">${ic('back',16)} Voltar</button><section class="city-hero">${imageTag(d.img,`Fotografia de ${d.name}`)}<div class="hero-content"><span class="tag transparent">${S(d.mode)} · ${S(d.region)}</span><h1 style="margin-top:12px">${S(d.name)}</h1><p>${S(d.desc)}</p><div class="row wrap"><button class="btn round" data-go="planner" data-id="${d.id}">${ic('plus',17)} Criar viagem para cá</button><button class="btn ghost round" data-action="mapdest" data-id="${d.id}">${ic('pin',16)} Ver no mapa</button></div></div></section><div class="notice mt16">${ic('info',15)} Distâncias e endereços de estabelecimentos fictícios são demonstrativos. Fotos reais representam o destino, mas fotos de estabelecimentos fictícios são ilustrativas.</div><div class="section-h"><div><h2>Conheça ${S(d.name)}</h2><p class="muted">Lugares, histórias e roteiros para sua viagem.</p></div></div>${tabs([['places','Lugares'],['routes','Roteiros da comunidade'],['posts','Publicações']],destTab,'desttab')}<div id="dest-results">${destinationResults()}</div>`}
function destinationResults(){let d=findDest(page.id);if(destTab==='places'){let matches=PLACES.filter(p=>(p.city===d.id||distanceKm(d,p)<=radius)&&(category==='all'||p.type===category)&&distanceKm(d,p)<=radius);return `<div class="row between wrap" style="margin:12px 0 20px"><div class="filter-strip" style="margin:0">${[['all','Todos'],['restaurant','Restaurantes'],['hotel','Hospedagens'],['attraction','Atrações'],['camping','Campings']].map(([id,t])=>`<button class="pill ${category===id?'active':''}" data-action="category" data-id="${id}">${t}</button>`).join('')}</div><label class="field"><span class="mini muted">Buscar num raio demonstrativo</span><select id="radius"><option value="1" ${radius==1?'selected':''}>Até 1 km</option><option value="3" ${radius==3?'selected':''}>Até 3 km</option><option value="5" ${radius==5?'selected':''}>Até 5 km</option><option value="10" ${radius==10?'selected':''}>Até 10 km</option><option value="20" ${radius==20?'selected':''}>Até 20 km</option></select></label></div><small>* Distâncias aproximadas em linha reta a partir do centro de ${S(d.name)}. Estabelecimentos fictícios usam posições demonstrativas.</small><div class="cards-grid mt16">${matches.map(placeCard).join('')}</div>${!matches.length?'<div class="empty">Não encontramos lugares nesse raio. Experimente ampliá-lo.</div>':''}`}

 return `<div class="row between mt16"><p class="muted">Fotos e histórias relacionadas a ${S(d.name)}.</p><button class="btn sm" data-action="newpost">${ic('plus',15)} Publicar</button></div><div class="cards-grid mt16">${allPosts().filter(p=>p.city===d.id).map(p=>`<article class="photo-card" data-go="post" data-id="${p.id}">${imageTag(p.photo||d.img,p.caption,'cover')}<div class="photo-body"><b>${S(userById(p.userId).name)}</b><p>${S(p.caption)}</p></div></article>`).join('')}</div>`}

function pageCommunity(){return `<div class="row between wrap"><div><div class="eyebrow">Pessoas, lugares e boas histórias</div><h1>Viajamos melhor juntos.</h1><p class="muted mt8">Compartilhe uma foto, encontre um lugar e inspire seu próximo roteiro.</p></div><button class="btn" data-action="newpost">${ic('plus',17)} Criar publicação</button></div>${tabs([['posts','Publicações'],['routes','Roteiros compartilhados'],['people','Viajantes']],communityTab,'communitytab')}<div id="community-results">${communityResults()}</div>`}

function pagePlace(){let p=findPlace(page.id);if(!p)return `<div class="empty">Lugar não encontrado.</div>`;let d=findDest(p.city), related=allPosts().filter(x=>x.placeId===p.id),more=PLACES.filter(x=>x.city===p.city&&x.id!==p.id&&x.type===p.type).slice(0,3);let photos=[p.photo,...(p.type==='restaurant'?[IMG.food[p.idx%3],IMG.restaurant[(p.idx+1)%4]]:p.type==='hotel'?[IMG.hotel[(p.idx+1)%4],IMG.hotel[(p.idx+2)%4]]:p.type==='camping'?[IMG.camping[1],d.img]:[d.img,d.img])];let pName=types[p.type].slice(0,-1);return `<button class="text-btn mb16" data-action="back">${ic('back',16)} Voltar</button><div class="row between wrap mb16"><div><div class="row gap8"><span class="tag orange">${S(p.category)}</span>${p.fiction?'<span class="tag gray">Perfil fictício</span>':'<span class="tag">Atração real</span>'}</div><h1 class="mt8">${S(p.name)}</h1><button class="text-btn mt8" data-go="destination" data-id="${d.id}">${ic('pin',15)} ${S(d.name)} · ${S(d.region)}</button></div><div class="row wrap"><button class="btn" data-action="addplace" data-id="${p.id}">${ic('plus',16)} Adicionar ao roteiro</button><button class="btn ghost" data-action="mapplace" data-id="${p.id}">${ic('pin',16)} Ver no mapa</button></div></div><div class="gallery" style="grid-template-columns:2fr 1fr 1fr">${photos.map((img,i)=>imageTag(img,`${p.name}, imagem ${i+1}`,'',`style="height:clamp(140px,19vw,265px);width:100%;cursor:zoom-in" data-action="zoom" data-id="${S(img)}"`)).join('')}</div><div class="notice mt16">${p.fiction?'Este estabelecimento, sua localização, preço, avaliações e cardápio são fictícios. As imagens são ilustrativas.':'O ponto turístico é real, mas os preços, horários e avaliações abaixo são simulados. A localização do marcador é aproximada.'}</div><div class="split mt24"><div class="stack gap20"><section><h2>Sobre este lugar</h2><p class="muted mt8">${S(p.desc)} ${p.type==='restaurant'?'Veja opções de pratos, publicações e coloque uma refeição no seu roteiro.':p.type==='hotel'?'Consulte comodidades e registre suas noites de estadia.':p.type==='camping'?'Uma possibilidade para encaixar no seu roteiro de carro ou motorhome.':'Explore a região, salve como ideia e inclua uma visita no dia que preferir.'}</p><div class="row wrap mt16">${[ic('star',17)+' 4,7 · avaliações simuladas',ic('pin',17)+` ${fmt(p.distance)} km do centro (aprox.)`,ic('calendar',17)+' Planejamento flexível'].map(x=>`<span class="tag gray">${x}</span>`).join('')}</div></section>${p.type==='restaurant'?`<section><div class="section-h"><h2>Cardápio de exemplo</h2><span class="tag gray">Preços fictícios</span></div><div class="info-panel"><table class="simple-table">${[['Prato da casa',p.price],['Massa ou refeição leve',Math.max(25,p.price-18)],['Sobremesa',25],['Bebida',16]].map(([n,v])=>`<tr><td>${n}</td><td>${cash(v)}</td></tr>`).join('')}</table></div></section>`:''}${p.type==='hotel'?`<section><div class="section-h"><h2>Hospedagem</h2><span class="tag gray">Informações simuladas</span></div><div class="info-panel"><div class="row wrap"><span class="tag">Wi-Fi</span><span class="tag">Recepção</span><span class="tag">Café opcional</span></div><p class="mt16">Quarto ilustrativo a partir de ${cash(p.price)} por noite. Na edição do roteiro você define o número de noites e pode alterar o valor.</p></div></section>`:''}${p.type==='attraction'?`<section><h2>Planeje sua visita</h2><p class="muted mt8">Consulte horários e condições oficiais antes de viajar. O preço exibido aqui serve exclusivamente para simulação de orçamento.</p></section>`:''}<section><div class="section-h"><h2>Avaliações de viajantes</h2><span class="tag gray">Exemplos fictícios</span></div><div class="info-panel"><div class="review"><b>Marina L. · ★★★★★</b><p class="muted">Uma ótima parada para encaixar na viagem. Gostei de explorar os arredores!</p></div><div class="review"><b>André P. · ★★★★☆</b><p class="muted">Boa experiência e localização interessante para o roteiro.</p></div></div></section><section><div class="section-h"><h2>Fotos e vídeos da comunidade</h2><span class="mini muted">Publicações vinculadas a este local</span></div>${related.length?`<div class="photo-grid">${related.map(post=>`<button data-go="post" data-id="${post.id}">${imageTag(post.photo||d.img,post.caption)}</button>`).join('')}</div>`:`<div class="empty">Ainda não há fotos associadas a este lugar nesta demonstração.<div class="mt16"><button class="btn sm" data-action="newpost" data-id="${d.id}" data-place="${p.id}">Compartilhar experiência</button></div></div>`}</section><section><h2>Mais para descobrir em ${S(d.name)}</h2><div class="tiles-grid mt16">${more.map(m=>`<div class="photo-card">${imageTag(m.photo,m.name,'cover',`data-go="place" data-id="${m.id}"`)}<div class="photo-body"><h3>${S(m.name)}</h3><button class="text-btn" data-go="place" data-id="${m.id}">Ver perfil ${ic('chevron',14)}</button></div></div>`).join('')}</div></section></div><aside class="info-panel sticky"><div class="eyebrow">Para o seu roteiro</div><h3 class="mt8">${cash(p.price)} <small>${S(p.priceUnit)}</small></h3><p class="muted mini">Valor demonstrativo · você pode editar na sua viagem.</p><div class="stack gap8 mt16"><button class="btn full" data-action="addplace" data-id="${p.id}">${ic('plus',16)} Adicionar ao roteiro</button><button class="btn ghost full" data-action="mapplace" data-id="${p.id}">${ic('pin',16)} Visualizar no mapa</button><button class="btn soft full" data-go="destination" data-id="${d.id}">Explorar mais lugares</button></div><p class="mini muted mt16">Adicionar não equivale a reservar. Reservas são apenas status informados pelo viajante.</p></aside></div>`}
function genPrice(d,mode,dateIndex=0){let factor={plane:1,bus:.35,car:.42,motorhome:.56}[mode]||1;let variation=[1,.87,1.14,.94,1.05,.81][dateIndex%6];return Math.round(d.travel*factor*variation/10)*10}
function pagePlanner(){let d=findDest(page.id||DEST[0].id);return `<div class="eyebrow">Planejar · do seu jeito</div><h1>Sua viagem começa com uma ideia.</h1><p class="muted mt8">Escolha o que já sabe. O restante pode ficar para depois.</p><div class="row wrap mt24"><button class="pill ${plannerMode==='known'?'active':''}" data-action="plannermode" data-id="known">${ic('pin',16)} Já sei para onde ir</button><button class="pill ${plannerMode==='unknown'?'active':''}" data-action="plannermode" data-id="unknown">${ic('compass',16)} Quero descobrir</button></div>${plannerMode==='unknown'?`<div class="welcome mt16"><h2>Às vezes, o destino encontra você.</h2><p>Explore destinos e roteiros de outros viajantes até encontrar sua próxima aventura.</p><button class="btn" data-go="explore">Conhecer destinos ${ic('chevron',15)}</button></div><div class="section-h"><h2>Para inspirar</h2></div><div class="tiles-grid">${DEST.slice(0,6).map(d=>`<div class="photo-card">${imageTag(d.img,d.name,'cover',`data-go="destination" data-id="${d.id}"`)}<div class="photo-body"><h3>${S(d.name)}</h3><button class="text-btn" data-go="planner" data-id="${d.id}">Planejar aqui</button></div></div>`).join('')}</div>`:`<div class="split mt24"><form id="plan-form" class="info-panel"><h2>Comece por aqui</h2><p class="muted mini mt8">Tudo pode ser alterado depois.</p><div class="form-grid mt16"><div class="field wide"><label>Nome do roteiro</label><input name="name" placeholder="Ex.: Uma semana em Paris" maxlength="80"></div><div class="field"><label>Destino</label><select name="city" id="plan-city">${DEST.map(c=>`<option value="${c.id}" ${c.id===d.id?'selected':''}>${S(c.name)}</option>`).join('')}</select></div><div class="field"><label>Como você quer viajar?</label><select name="mode" id="plan-mode"><option value="plane">Avião</option><option value="bus">Ônibus</option><option value="car">Carro</option><option value="motorhome">Motorhome</option></select></div><div class="field"><label>Cidade de partida</label><input name="origin" value="Florianópolis" placeholder="Ex.: Florianópolis" maxlength="90"></div><div class="field"><label>Quantidade de viajantes</label><input type="number" name="people" min="1" max="20" value="1"></div><div class="field"><label>Data de saída (opcional)</label><input name="start" id="plan-start" type="date" value="2026-11-28"></div><div class="field"><label>Data de volta (opcional)</label><input name="end" type="date" value="2026-12-03"></div><div class="field wide"><label>Estilo de rota (para carro ou motorhome)</label><select name="routeType"><option value="fast">Mais rápida</option><option value="scenic">Mais panorâmica, com paradas</option></select></div></div><div id="price-options" class="mt16">${priceOptions(d.id,'plane')}</div><button class="btn full mt16" type="submit">${ic('plus',17)} Criar meu roteiro</button><p class="mini muted mt8">Valores de transporte são fictícios, não cotações. Nenhuma compra é realizada.</p></form><aside class="stack"><div class="photo-card">${imageTag(d.img,d.name,'cover',`style="height:235px" data-go="destination" data-id="${d.id}"`)}<div class="photo-body"><h3>${S(d.name)}</h3><p>${S(d.desc)}</p><button class="text-btn mt8" data-go="destination" data-id="${d.id}">Conhecer destino ${ic('chevron',15)}</button></div></div><div class="notice">Dica: você pode criar vários roteiros ao mesmo tempo. Adicione lugares diretamente do feed, dos perfis ou das páginas dos destinos.</div></aside></div>`}`}
function priceOptions(cityId,mode){let d=findDest(cityId),start='2026-11-28';const dates=['2026-11-28','2026-12-05','2026-12-12','2026-12-19','2027-01-09','2027-01-16'];return `<div class="row between wrap"><b>${mode==='plane'?'Passagens demonstrativas':mode==='bus'?'Viagem rodoviária simulada':'Estimativa de deslocamento'}</b><span class="tag gray">Exemplos · ida e volta / por pessoa</span></div><p class="muted mini mt8">Escolha uma data de referência ou digite a que preferir.</p><div class="cards-grid mt8">${dates.map((dt,i)=>`<label class="card" style="padding:10px;cursor:pointer;border-radius:13px"><div class="row between"><span class="mini"><input type="radio" name="date-price" value="${dt}" data-priceindex="${i}" ${i===0?'checked':''}> ${labelDate(dt)}</span><b style="color:var(--green)">${cash(genPrice(d,mode,i))}</b></div></label>`).join('')}</div>`}
function pageTrips(){return `<div class="row between wrap"><div><div class="eyebrow">Tudo o que você está imaginando</div><h1>Meus roteiros</h1><p class="muted mt8">Suas viagens ficam organizadas aqui, mesmo que ainda sejam só ideias.</p></div><div class="row wrap"><button class="btn" data-go="planner">${ic('plus',17)} Nova viagem</button><button class="btn ghost" data-action="export">${ic('download',16)} Exportar JSON</button></div></div>${state.trips.length?`<div class="tiles-grid mt24">${state.trips.map(t=>{let d=findDest(t.city);return `<article class="photo-card">${imageTag(d.img,d.name,'cover',`data-go="trip" data-id="${t.id}"`)}<div class="photo-body"><span class="tag orange">${S(d.name)}</span><h3>${S(t.name)}</h3><p>${t.start?`${labelDate(t.start)} · `:'Datas em aberto · '}${(t.entries||[]).length} atividades</p><h3 style="color:var(--green);margin:8px 0">${cash(tripTotal(t))}</h3><button class="btn sm green" data-go="trip" data-id="${t.id}">Abrir roteiro ${ic('chevron',15)}</button></div></article>`}).join('')}</div>`:`<div class="empty mt24">${ic('route',38)}<h2 class="mt16">Toda grande viagem começa com um plano.</h2><p class="muted mt8">Crie seu primeiro roteiro e comece adicionando lugares que encontrar pela comunidade.</p><button class="btn mt16" data-go="planner">Criar meu primeiro roteiro</button></div>`}`}
const tripBy=id=>state.trips.find(t=>t.id===id);
const entryCost=e=>Number(e.price||0)*Math.max(1,Number(e.qty||1))*Math.max(1,Number(e.nights||1));
const tripActivitiesTotal=t=>(t.entries||[]).reduce((s,e)=>s+entryCost(e),0);
const tripTotal=t=>(Number(t.travelCost||0)*Math.max(1,Number(t.people||1)))+tripActivitiesTotal(t);
const dayDate=(t,day)=>{if(!t.start)return `Dia ${day}`;let x=new Date(t.start+'T12:00:00');x.setDate(x.getDate()+day-1);return `Dia ${day} · ${x.toLocaleDateString('pt-BR')}`};
function eventCard(e,t,readonly=false){let p=findPlace(e.placeId),d=findDest(t.city),photo=p?.photo||d.img,name=p?.name||'Local indisponível',cat=p?.category||'Atividade';let content=`<img src="${S(photo)}" alt="${S(name)}" class="event-img" loading="lazy" data-go="place" data-id="${S(p?.id||'')}" onerror="this.onerror=null;this.removeAttribute('src');this.style.background='linear-gradient(135deg,#f8dcc7,#dcebdc)';this.alt='Imagem indisponível'"><div class="event-info"><div class="row wrap gap8"><span class="tag gray">${S(e.time||'Horário livre')}</span><span class="mini muted">${S(cat)}</span><span class="mini muted">${e.day?`Dia ${e.day}`:'Sem data definida'}</span></div><h3 class="mt8" data-go="place" data-id="${S(p?.id||'')}">${S(name)}</h3><p class="muted mini">${cash(entryCost(e))} ${e.nights>1?' · '+e.nights+' noites':''} · ${S(e.status||'Planejado')}${e.notes?' · '+S(e.notes):''}</p><div class="event-actions"><button class="btn ghost sm" data-go="place" data-id="${S(p?.id||'')}">Ver perfil</button>${readonly?'':`<button class="btn soft sm" data-action="editevent" data-id="${S(t.id)}" data-entry="${S(e.id)}">${ic('edit',14)} Editar evento</button><button class="btn soft sm" data-action="removeevent" data-id="${S(t.id)}" data-entry="${S(e.id)}">Remover</button>`}</div></div>`;return `<article class="event-card">${content}</article>`}
function timeline(t,readonly=false){let entries=(t.entries||[]).slice().sort((a,b)=>(Number(a.day||999)-Number(b.day||999))||String(a.time||'99:99').localeCompare(String(b.time||'99:99')));let dated=entries.filter(e=>Number(e.day)>0),undated=entries.filter(e=>!Number(e.day));let days=[...new Set(dated.map(e=>Number(e.day)))].sort((a,b)=>a-b);return `<div class="timeline">${days.map(day=>`<div class="day-group"><h3 style="color:var(--green)">${dayDate(t,day)}</h3>${dated.filter(e=>Number(e.day)===day).map(e=>eventCard(e,t,readonly)).join('')}</div>`).join('')}<div class="day-group"><h3 style="color:var(--green)">Ideias sem data definida</h3>${undated.length?undated.map(e=>eventCard(e,t,readonly)).join(''):'<p class="muted mt8">Nenhuma ideia pendente por enquanto.</p>'}</div></div>`}
function budgetBlock(t){let byType={restaurant:0,hotel:0,attraction:0,camping:0};for(let e of(t.entries||[])){let p=findPlace(e.placeId);if(p)byType[p.type]+=entryCost(e)}let travel=Number(t.travelCost||0)*Math.max(1,Number(t.people||1));return `<div class="info-panel sticky"><span class="eyebrow">Orçamento vivo</span><h2 class="mt8">Quanto vai custar?</h2><div class="budget-line"><span>Transporte (${t.people||1} pessoa(s))</span><b>${cash(travel)}</b></div>${[['hotel','Hospedagens'],['restaurant','Alimentação'],['attraction','Passeios'],['camping','Campings']].map(([k,label])=>`<div class="budget-line"><span>${label}</span><b>${cash(byType[k])}</b></div>`).join('')}<div class="mini muted">Total estimado</div><div class="budget-total">${cash(tripTotal(t))}</div><p class="mini muted mt8">Os custos mudam automaticamente ao editar valores, quantidade de pessoas e noites. Preços cadastrados são apenas exemplos.</p><div class="stack gap8 mt16"><button class="btn full" data-go="destination" data-id="${t.city}">${ic('plus',15)} Explorar locais</button><button class="btn ghost full" data-action="mapdest" data-id="${t.city}">${ic('pin',16)} Ver destino no mapa</button></div></div>`}
function pageTrip(){let t=tripBy(page.id);if(!t)return `<div class="empty">Roteiro não encontrado.</div>`;let d=findDest(t.city);return `<button class="text-btn mb16" data-go="trips">${ic('back',16)} Meus roteiros</button><div class="row between wrap"><div><span class="tag orange">Roteiro pessoal · ${S(d.name)}</span><h1 class="mt8">${S(t.name)}</h1><p class="muted mt8">${t.start?`${labelDate(t.start)}${t.end?' a '+labelDate(t.end):''}`:'Datas em aberto'} · ${(t.entries||[]).length} atividades · ${S(t.origin||'Origem livre')} · ${S({plane:'Avião',bus:'Ônibus',car:'Carro',motorhome:'Motorhome'}[t.mode]||'Transporte')}</p></div><div class="row wrap"><button class="btn ghost" data-action="edittrip" data-id="${t.id}">${ic('edit',16)} Editar viagem</button><button class="btn" data-go="destination" data-id="${d.id}">${ic('plus',16)} Explorar lugares</button></div></div><div class="split mt24"><div><div class="welcome" style="margin-bottom:23px"><div class="eyebrow">Sua viagem, em sequência</div><h2 class="mt8">Um caminho feito por você.</h2><p>Arraste a ideia para o calendário editando o dia; abra o perfil de cada parada e personalize os gastos quando quiser.</p></div>${timeline(t)}<button class="btn ghost" data-action="edittrip" data-id="${t.id}">Editar dados da viagem</button><button class="btn soft" style="margin-left:8px" data-action="deletetrip" data-id="${t.id}">Excluir roteiro</button></div>${budgetBlock(t)}</div>`}
function pageRoute(){let r=COMMUNITY_ROUTES.find(r=>r.id===page.id);if(!r)return '<div class="empty">Roteiro não encontrado.</div>';let d=findDest(r.city),u=userById(r.userId),t={city:r.city,entries:r.entries.map(e=>({...e,status:'Planejado'})),start:'',people:1,travelCost:0};return `<button class="text-btn mb16" data-action="back">${ic('back',16)} Voltar</button><div class="city-hero">${imageTag(r.cover||d.img,d.name)}<div class="hero-content"><span class="tag transparent">${r.days} dias · ${S(d.name)}</span><h1 class="mt8">${S(r.name)}</h1><p>por ${S(u.name)} · Roteiro comunitário fictício</p><div class="row wrap"><button class="btn" data-action="copyroute" data-id="${r.id}">${ic('plus',17)} Usar como base</button><button class="btn ghost" data-go="profile" data-id="${u.id}">Ver perfil do viajante</button></div></div></div><div class="split mt24"><div><h2>Viagem em formato de trilha</h2><p class="muted mt8">Cada parada tem foto de capa e acesso ao perfil do lugar. Datas e horários são exemplos.</p>${timeline(t,true)}</div><aside class="info-panel sticky"><h3>Resumo do roteiro</h3><div class="budget-line"><span>Duração</span><b>${r.days} dias</b></div><div class="budget-line"><span>Orçamento fictício</span><b>${cash(r.budget)}</b></div><p class="muted mini">O valor de exemplo inclui estimativas não detalhadas aqui; copiar o roteiro cria entradas editáveis no seu navegador.</p><button class="btn full mt16" data-action="copyroute" data-id="${r.id}">Copiar para meus roteiros</button></aside></div>`}
function mapFrame(lat,lon){let delta=.025,box=[lon-delta,lat-delta,lon+delta,lat+delta].map(x=>x.toFixed(5)).join('%2C'),marker=`${lat.toFixed(5)}%2C${lon.toFixed(5)}`;return `<iframe class="mapframe" title="Mapa aproximado no OpenStreetMap" loading="lazy" referrerpolicy="no-referrer" src="https://www.openstreetmap.org/export/embed.html?bbox=${box}&layer=mapnik&marker=${marker}"></iframe><p class="mini muted mt8">Mapa público do OpenStreetMap. A posição de lugares fictícios é ilustrativa.</p><a class="btn ghost sm mt8" rel="noopener" target="_blank" href="https://www.openstreetmap.org/?mlat=${lat}&mlon=${lon}#map=14/${lat}/${lon}">${ic('external',15)} Abrir mapa ampliado</a>`}

 if(modal.kind==='add'){let p=findPlace(modal.id);if(!state.trips.length)return `<div class="modal-head"><b>Adicionar ao roteiro</b><button class="btn-close" data-action="close">✕ Fechar</button></div><div class="modal-body"><h2>Primeiro, crie uma viagem.</h2><p class="muted mt8">Você pode ter vários roteiros ao mesmo tempo e escolher a qual adicionar cada lugar.</p><button class="btn mt16" data-go="planner" data-id="${p.city}">${ic('plus',16)} Criar viagem para ${S(findDest(p.city).name)}</button></div>`;let t=tripBy(modal.tripId)||state.trips[0];modal.tripId=t.id;return `<div class="modal-head"><b>Adicionar ao meu roteiro</b><button class="btn-close" data-action="close">✕ Fechar</button></div><div class="modal-body"><div class="row" style="align-items:start">${imageTag(p.photo,p.name,'',`style="width:100px;height:92px;border-radius:13px"`)}<div><h3>${S(p.name)}</h3><p class="muted mini">${S(findDest(p.city).name)} · ${S(p.category)}</p><b style="color:var(--green)">${cash(p.price)} <span class="muted mini">${S(p.priceUnit)}</span></b></div></div><form id="add-form" class="form-grid mt16"><input type="hidden" name="placeId" value="${p.id}"><div class="field wide"><label>Em qual viagem?</label><select name="tripId" id="add-trip-choice">${state.trips.map(x=>`<option value="${x.id}" ${x.id===t.id?'selected':''}>${S(x.name)} (${S(findDest(x.city).name)})</option>`).join('')}</select></div><div class="field"><label>Dia da viagem</label><select name="day"><option value="0">Ainda não sei (ideias)</option>${Array.from({length:Math.max(14,tripSpan(t))},(_,i)=>`<option value="${i+1}">${dayDate(t,i+1)}</option>`).join('')}</select></div><div class="field"><label>Horário opcional</label><input name="time" type="time"></div><div class="field"><label>Valor unitário (R$)</label><input name="price" type="number" min="0" step="0.01" value="${p.price}"></div><div class="field"><label>${['hotel','camping'].includes(p.type)?'Quartos / vagas':'Pessoas / unidades'}</label><input name="q function dContact(){return `<div class="field" style="margin-top:16px"><label>Seu nome</label><input type="text" data-dk="Nome" value="${S(dform.v['Nome']||'')}" maxlength="80" autocomplete="name"></div>
<div class="field" style="margin-top:16px"><label>E-mail</label><input type="email" data-dk="E-mail" value="${S(dform.v['E-mail']||'')}" maxlength="120" autocomplete="email" placeholder="voce@exemplo.com"></div>
<div class="field" style="margin-top:16px"><label>WhatsApp</label><input type="tel" data-dk="WhatsApp" value="${S(dform.v['WhatsApp']||'')}" maxlength="25" autocomplete="tel" placeholder="(48) 99999-9999"></div>
<p class="muted" style="margin-top:8px;font-size:13px">Informe pelo menos um contato (e-mail ou WhatsApp).</p>
<div style="position:absolute;left:-9999px" aria-hidden="true"><input type="text" tabindex="-1" autocomplete="off" data-dk="hp"></div>
<label style="display:flex;gap:10px;align-items:flex-start;margin-top:18px;padding:14px;background:var(--sand);border-radius:14px;font-size:14px;line-height:1.45"><input type="checkbox" data-dconsent ${dform.consent?'checked':''} style="margin-top:3px"><span>Concordo em compartilhar estas respostas com a equipe do Viage. Entendo que a sugestão é <b>montada manualmente pela equipe</b> e que meu contato será usado <b>apenas para enviar a sugestão</b>.</span></label>`}
function pageDiscover(){
 if(dform.sent){let who=dform.v['E-mail']&&dform.v['WhatsApp']?'por WhatsApp ou e-mail':(dform.v['WhatsApp']?'por WhatsApp':'por e-mail');return `<div class="card" style="max-width:640px;margin:20px auto;padding:34px;text-align:center"><div style="font-size:44px">🧡</div><div class="eyebrow" style="margin-top:10px">Pedido recebido</div><h1 style="font-size:30px;margin-top:6px">Obrigado, ${S((dform.v['Nome']||'').split(' ')[0])}!</h1><p class="muted" style="margin:12px auto 22px;max-width:460px;line-height:1.55">Nossa equipe vai analisar suas respostas e enviar uma sugestão de destino ${who}. Se quiser, explore o Viage enquanto isso.</p><div class="row" style="justify-content:center;gap:10px;flex-wrap:wrap"><button class="btn" data-go="explore">Explorar destinos</button><button class="btn ghost" data-d="again">Fazer outro pedido</button></div></div>`}
 let st=DISCOVER_STEPS[dform.step],n=DISCOVER_STEPS.length,last=dform.step===n-1;
 return `<div style="max-width:700px;margin:0 auto"><div class="eyebrow">Me ajude a escolher · passo ${dform.step+1} de ${n}</div><h1 style="margin-top:4px">${S(st.title)}</h1><p class="muted" style="margin-top:6px">${S(st.sub)}</p>
 <div aria-hidden="true" style="height:8px;background:var(--sand);border-radius:99px;margin:16px 0 4px;overflow:hidden"><div style="height:100%;width:${(dform.step+1)/n*100}%;background:var(--orange);border-radius:99px;transition:width .25s"></div></div>
 <div class="card" style="padding:22px;margin-top:14px">${st.contact?dContact():st.fields.map(dField).join('')}
 ${dform.err?`<p role="alert" style="margin-top:16px;color:var(--darkorange);font-weight:700">${S(dform.err)}</p>`:''}
 <div class="row" style="justify-content:space-between;margin-top:22px;gap:10px"><button class="btn ghost" data-d="prev" ${dform.step===0?'style="visibility:hidden"':''}>Voltar</button><button class="btn" data-d="${last?'send':'next'}" ${dform.sending?'disabled':''}>${last?(dform.sending?'Enviando…':'Enviar pedido'):'Continuar'}</button></div></div>
 <p class="muted" style="margin-top:14px;font-size:13px;text-align:center">Sugestão montada manualmente pela equipe. Seus dados são usados só para o retorno.</p></div>`}
function dValidate(){let st=DISCOVER_STEPS[dform.step];if(st.contact){let v=dform.v;if(!(v['Nome']||'').trim())return 'Informe seu nome.';let em=(v['E-mail']||'').trim(),wa=(v['WhatsApp']||'').replace(/\D/g,'');if(!em&&!wa)return 'Informe pelo menos um contato: e-mail ou WhatsApp.';if(em&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em))return 'Confira o e-mail informado.';if(wa&&(wa.length<10||wa.length>13))return 'Confira o WhatsApp (com DDD).';if(!dform.consent)return 'Marque o consentimento para enviar.';return ''}
 for(let f of st.fields){if(!f.req)continue;let x=dform.v[f.k];if(f.type==='multi'?!(x&&x.length):!(x&&String(x).trim()))return 'Responda: '+f.label.replace(/\s*\(.*\)/,'');}return ''}
function dRedraw(){let y=window.scrollY;render();window.scrollTo({top:y,behavior:'instant'})}
async function dSend(){if(dform.sending)return;if((dform.v['hp']||'').length){dform.sent=true;render();return}
 let fields={};for(let s of DISCOVER_STEPS){if(s.contact){for(let k of['Nome','E-mail','WhatsApp'])fields[k]=(dform.v[k]||'').trim()}else for(let f of s.fields){let x=dform.v[f.k];fields[f.k]=Array.isArray(x)?x.join(', '):(x||'').trim()}}
 fields['Consentimento']='sim';dform.sending=true;dform.err='';dRedraw();
 try{await fetch(API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'create',id:dform.sid,hp:'',fields})});dform.sent=true;dform.sending=false;render();window.scrollTo({top:0,behavior:'instant'})}
 catch(e){console.error(e);dform.sending=false;dform.err='Não foi possível enviar agora. Verifique sua conexão e tente novamente.';dRedraw()}}
document.addEventListener('click',e=>{let el=e.target.closest('[data-d]');if(!el)return;let a=el.dataset.d;
 if(a==='opt'){let k=el.dataset.k,v=el.dataset.v,f=DISCOVER_STEPS.flatMap(s=>s.fields||[]).find(x=>x.k===k);if(!f)return;if(f.type==='multi'){let arr=dform.v[k]||[];if(arr.includes(v))arr=arr.filter(x=>x!==v);else if(arr.length<f.max)arr=[...arr,v];else{toast('Escolha até '+f.max+' opções.');return}dform.v[k]=arr}else dform.v[k]=v;dform.err='';dRedraw()}
 else if(a==='next'){let m=dValidate();if(m){dform.err=m;dRedraw();return}dform.err='';dform.step++;render();window.scrollTo({top:0,behavior:'instant'})}
 else if(a==='prev'){dform.err='';dform.step=Math.max(0,dform.step-1);render();window.scrollTo({top:0,behavior:'instant'})}
 else if(a==='send'){let m=dValidate();if(m){dform.err=m;dRedraw();return}dSend()}
 else if(a==='again'){dform={step:0,v:{},sent:false,sending:false,err:'',consent:false,sid:uid()};render();window.scrollTo({top:0,behavior:'instant'})}});
document.addEventListener('input',e=>{let k=e.target.dataset&&e.target.dataset.dk;if(k)dform.v[k]=e.target.value});
document.addEventListener('change',e=>{if(e.target.matches&&e.target.matches('[data-dconsent]')){dform.consent=e.target.checked;dform.err=''}});

// Apply locally written comments to seeded and custom posts without changing public demo data.
const originalAllPosts=allPosts;
allPosts=()=>originalAllPosts().map(p=>({...p,comments:[...(p.comments||[]),...((state.comments||{})[p.id]||[])]}));
render();
</script></body></html>
